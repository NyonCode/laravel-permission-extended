name: Tests

on:
  push:
    branches: [main, '*.x']
  pull_request:
    branches: [main, '*.x']

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / L${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 11+ requires PHP 8.2+
          - laravel: '11.*'
            php: ['8.1']
          # Laravel 12+ requires PHP 8.2+
          - laravel: '12.*'
            php: ['8.1']
          - laravel: '13.*'
            php: ['8.1', '8.2']
          # Skip prefer-lowest on Windows to save CI time
          - os: windows-latest
            stability: prefer-lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --colors=always --min=70
